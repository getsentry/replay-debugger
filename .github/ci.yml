name: ⚙️ CI

on:
  push:
    branches:
      - "main"
      - "release/**"
    paths-ignore:
      - "*.md"

  pull_request:
    paths-ignore:
      - "*.md"

# Cancel in-progress runs on PR update and on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🛠️ Build app
    runner: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build app
        run: |
          xcodebuild -project SentryReplayDebugger.xcodeproj \
              -scheme SentryReplayDebugger \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              clean build
