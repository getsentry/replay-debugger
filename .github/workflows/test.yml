name: Test

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Create Config.xcconfig
        run: cp Config.example.xcconfig Config.xcconfig

      - name: Run tests
        run: |
          xcodebuild test \
              -project SentryReplayDebugger.xcodeproj \
              -scheme SentryReplayDebugger \
              -configuration Debug \
              -destination 'platform=macOS,arch=arm64' \
              -only-testing:SentryReplayDebuggerTests \
              CODE_SIGNING_ALLOWED=NO
