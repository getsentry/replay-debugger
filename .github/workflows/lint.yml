name: Lint

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: swift-format & SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Tool versions
        run: |
          xcodebuild -version
          xcrun swift-format --version
          swiftlint version

      - name: swift-format (strict)
        run: |
          xcrun swift-format lint --strict --recursive \
            --configuration .swift-format \
            SentryReplayDebugger SentryReplayDebuggerTests SentryReplayDebuggerUITests

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
