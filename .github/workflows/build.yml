name: 🛠️ Build

on:
  workflow_call:
    inputs:
      notarize:
        type: boolean
        default: false

    secrets:
      FASTLANE_KEYCHAIN_PASSWORD:
        required: true
      MATCH_GIT_PRIVATE_KEY:
        required: true
      MATCH_PASSWORD:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Needed for fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@d354de180d0c9e813cfddfcbdc079945d4be589b # v1.275.0
        with:
          ruby-version: 3.4.8
          bundler-cache: true

      - name: Import certificate and profile
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane prepare_signing

      - name: Build app
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane build_release

      - name: Zip app
        run: |
          ls -R build
          cd build
          zip -r --symlinks "${{ github.workspace }}/SentryReplayDebugger.zip" SentryReplayDebugger.app

      - name: Notarize app
        if: inputs.notarize
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: bundle exec fastlane notarize_app zip_path:"${{ github.workspace }}/SentryReplayDebugger.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.sha }}
          path: SentryReplayDebugger.zip
