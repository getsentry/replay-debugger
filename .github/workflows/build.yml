name: Build

on:
  workflow_call:
    inputs:
      notarize:
        type: boolean
        default: false

    secrets:
      FASTLANE_KEYCHAIN_PASSWORD:
        required: true
      MATCH_GIT_PRIVATE_KEY:
        required: true
      MATCH_PASSWORD:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_KEY:
        required: true
      SENTRY_DSN:
        required: false
      OAUTH_CLIENT_ID:
        required: true
      OAUTH_CLIENT_SECRET:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: macos-26
    env:
      APP_ARCHIVE: build/Release/SentryReplayDebugger.zip
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Create Config.xcconfig
        run: cp Config.example.xcconfig Config.xcconfig

      # Needed for fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@d354de180d0c9e813cfddfcbdc079945d4be589b # v1.275.0
        with:
          ruby-version: 3.4.8
          bundler-cache: true

      - name: Import certificate and profile
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane prepare_signing

      - name: Build app
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: bundle exec fastlane build_release

      # Sparkle ships its nested helpers (XPC services, Updater.app, Autoupdate) ad-hoc
      # signed; Xcode does not re-sign them on embed, so notarization rejects the app.
      # Re-sign them with Developer ID + hardened runtime before notarizing.
      - name: Re-sign Sparkle helpers
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane codesign_sparkle

      - name: Notarize app
        if: inputs.notarize
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: bundle exec fastlane notarize_app

      - name: Zip app
        run: bundle exec fastlane zip_app zip_path:"${APP_ARCHIVE}"

      # Only generated for notarized (release) builds. Produces build/Release/appcast.xml,
      # which craft attaches to the GitHub release alongside the zip so Sparkle's
      # SUFeedURL (releases/latest/download/appcast.xml) resolves to the newest feed.
      - name: Generate Sparkle appcast
        if: inputs.notarize
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bundle exec fastlane generate_appcast

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ github.sha }}
          path: |
            ${{ env.APP_ARCHIVE }}
            build/Release/appcast.xml
          if-no-files-found: warn
